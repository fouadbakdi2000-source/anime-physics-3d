name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & create Android project
        run: |
          npm install -g cordova@11.0.0
          cordova create anime-physics com.verdroid.animephysics "Anime Physics Studio"
          cp www/index.html anime-physics/www/index.html
          cp config.xml anime-physics/config.xml
          cd anime-physics
          cordova platform add android@12.0.0
          cd ..
          # Gradle 9 (on ubuntu-latest) breaks Cordova's old Groovy; pin Gradle 8.7
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH=/opt/gradle-8.7/bin:$PATH
          gradle -v | head -6
          cd anime-physics
          cordova build android --release

      - name: Sign APK with debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cd anime-physics
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore ../debug.keystore -storepass android -keypass android platforms/app/build/outputs/apk/release/app-release-unsigned.apk androiddebugkey || true
          cp platforms/app/build/outputs/apk/release/app-release-unsigned.apk ../anime-physics-3d.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-physics-3d-apk
          path: anime-physics-3d.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: anime-physics-3d.apk
          name: Anime Physics Studio 3D - Auto Build
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}